<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>候補一覧</title>
<style>
:root{
  --ink:#16202A; --sub:#5B6773; --rule:#D5DBE0; --bg:#F4F6F7; --paper:#FFFFFF;
  --core:#0E5E6F; --core-bg:#E3F0F2;
  --bench:#5A4E9C; --bench-bg:#EAE7F6;
  --periph:#5B6773; --periph-bg:#E9EBED;
  --trend:#9C5B1E; --trend-bg:#F5E7D6;
  --go:#0E5E6F; --go-bg:#E3F0F2; --warn:#8A5300; --warn-bg:#FBF0DC;
  --shadow:0 1px 2px rgba(22,32,42,.05), 0 4px 14px rgba(22,32,42,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  font-size:15px;line-height:1.7;font-feature-settings:"palt"}
main{max-width:920px;margin:0 auto;padding:40px 20px 80px}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  padding:8px 16px;border-radius:7px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--sub)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--core);outline-offset:2px}
.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary:hover{background:#2A3845}

#gate{max-width:360px;margin:18vh auto 0}
#gate h1{font-size:20px;font-weight:600;margin:0 0 4px}
#gate p{color:var(--sub);font-size:13px;margin:0 0 20px}
#gate input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;margin-bottom:12px}
#err{color:#A32D2D;font-size:13px;min-height:1.4em;margin:0 0 8px}

#app{display:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
.head h1{font-size:32px;font-weight:600;letter-spacing:.02em;margin:0;line-height:1.2}
.head h1 small{display:block;font-size:14px;font-weight:400;color:var(--sub);letter-spacing:0;margin-top:6px}
.tally{font-size:13px;color:var(--sub);margin:10px 0 18px}
.tally b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin-bottom:4px;
  border-bottom:1px solid var(--rule)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;font:inherit;padding:9px 12px;border:1px solid var(--rule);border-radius:7px;background:var(--paper)}
.search button{white-space:nowrap;font-size:13px;color:var(--sub)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters button{font-size:13px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px}
.filters button .dot{width:8px;height:8px;border-radius:50%;background:var(--edge,var(--sub));flex:none}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters button[aria-pressed="true"] .dot{background:#fff}
.selects{display:flex;gap:8px;flex-wrap:wrap}
.selects select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--rule);border-radius:7px;
  background:var(--paper);color:var(--ink)}
.result-count{font-size:12px;color:var(--sub);margin:10px 2px 12px}
.result-count button{font-size:12px;padding:2px 9px;margin-left:6px;color:var(--sub)}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list li{background:var(--paper);border:1px solid var(--rule);border-radius:9px;
  border-left:4px solid var(--edge);padding:15px 18px;box-shadow:var(--shadow)}
ul.list li[data-tier="コア"]{border-left-color:var(--core)}
ul.list li[data-tier="ベンチマーク"]{border-left-color:var(--bench)}
ul.list li[data-tier="周辺"]{border-left-color:var(--periph)}
ul.list li[data-tier="業界動向"]{border-left-color:var(--trend)}
.meta{font-size:12px;color:var(--sub);margin:0;display:flex;flex-wrap:wrap;gap:0}
.meta span+span::before{content:"／";margin:0 4px;color:var(--rule)}
.title{font-size:16px;font-weight:600;margin:4px 0 8px;line-height:1.55}
.title a{color:inherit;text-decoration-color:var(--rule);text-underline-offset:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.tag{padding:2px 9px;border-radius:5px;background:var(--bg);color:var(--sub);font-weight:500}
.tag.tier-コア{background:var(--core-bg);color:var(--core);font-weight:600}
.tag.tier-ベンチマーク{background:var(--bench-bg);color:var(--bench);font-weight:600}
.tag.tier-周辺{background:var(--periph-bg);color:var(--periph);font-weight:600}
.tag.tier-業界動向{background:var(--trend-bg);color:var(--trend);font-weight:600}
.tag.go{background:var(--go-bg);color:var(--go);font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.reason{font-size:13px;color:var(--sub);margin:8px 0 0}
details{margin-top:10px}
summary{font-size:13px;color:var(--core);cursor:pointer}
.draft{margin:8px 0 0;padding:12px 14px;background:var(--bg);border-radius:6px;font-size:14px}
.draft dt{font-weight:600;font-size:13px;margin-top:8px}
.draft dt:first-child{margin-top:0}
.draft dd{margin:2px 0 0}
.empty{padding:36px 20px;text-align:center;color:var(--sub);background:var(--paper);
  border:1px solid var(--rule);border-radius:9px}
.empty button{margin-top:10px;font-size:13px}
.foot{font-size:12px;color:var(--sub);margin-top:16px}
mark{background:#FBEFC0;color:inherit;border-radius:2px;padding:0 1px}
.wc-overlay{position:fixed;inset:0;background:rgba(22,32,42,.5);z-index:20;
  display:flex;align-items:center;justify-content:center;padding:20px}
.wc-overlay[hidden]{display:none}
.wc-modal{background:var(--paper);border-radius:10px;max-width:640px;width:100%;
  max-height:82vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.wc-modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px 4px}
.wc-modal-head h2{font-size:17px;margin:0}
.wc-modal-head button{border:none;background:none;font-size:16px;color:var(--sub);padding:4px 8px}
.wc-modal-head button:hover{color:var(--ink)}
.wc-modal-sub{font-size:12px;color:var(--sub);margin:0 20px 10px}
.wc-modal-body{overflow-y:auto;padding:0 20px 20px}
.wc-tier{font-size:13px;font-weight:600;margin:16px 0 8px;padding:2px 8px;
  border-radius:5px;display:inline-block}
.wc-tier.wc-コア{background:var(--core-bg);color:var(--core)}
.wc-tier.wc-ベンチマーク{background:var(--bench-bg);color:var(--bench)}
.wc-tier.wc-周辺{background:var(--periph-bg);color:var(--periph)}
.wc-company{border-bottom:1px solid var(--rule);padding:8px 0}
.wc-company:last-child{border-bottom:none}
.wc-company-name{font-size:13px;font-weight:600}
.wc-company-cat{font-size:11px;color:var(--sub);margin-left:6px}
.wc-media{font-size:12px;margin:3px 0 0;padding-left:2px}
.wc-media a{color:var(--core);text-decoration-color:var(--rule)}
.wc-media-label{color:var(--sub)}
@media (max-width:560px){
  .head h1{font-size:26px}
  .toolbar{top:0}
  .search{flex-direction:column}
}
@media (prefers-reduced-motion:no-preference){ul.list li{transition:box-shadow .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <section id="gate">
    <h1>候補一覧</h1>
    <p>パスワードを入力すると、この端末の中だけで内容を表示します。</p>
    <form id="gateForm">
      <input id="pw" type="password" autocomplete="current-password" aria-label="パスワード" placeholder="パスワード">
      <p id="err" role="alert"></p>
      <button class="primary" type="submit" style="width:100%">表示する</button>
    </form>
  </section>

  <section id="app" aria-live="polite">
    <div class="head">
      <h1 id="dateTitle"><small id="period"></small></h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="showWatchConfig" type="button">企業リストを見る</button>
        <button class="primary" id="dl">Excelをダウンロード</button>
      </div>
    </div>
    <p class="tally" id="tally"></p>

    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" placeholder="社名・見出し・理由で検索" aria-label="検索">
      </div>
      <div class="filters" id="tierFilters" role="group" aria-label="区分で絞り込み"></div>
      <div class="selects">
        <select id="fRec" aria-label="AI推奨で絞り込み"><option value="all">AI推奨：すべて</option></select>
        <select id="fStatus" aria-label="確認状況で絞り込み"><option value="all">確認状況：すべて</option></select>
        <select id="fCompany" aria-label="企業で絞り込み"><option value="all">企業：すべて</option></select>
        <select id="sort" aria-label="並べ替え">
          <option value="date_desc">日付が新しい順</option>
          <option value="date_asc">日付が古い順</option>
          <option value="impact">自社への影響が大きい順</option>
          <option value="novelty">斬新性が高い順</option>
        </select>
      </div>
    </div>
    <p class="result-count" id="resultCount"></p>

    <ul class="list" id="list"></ul>
    <p class="foot">報告するかどうかは、ダウンロードしたExcelの「判断」列で選んでください。速報下書きはExcelの2枚目のシートにも入っています。</p>
  </section>
</main>

<div id="wcOverlay" class="wc-overlay" hidden>
  <div class="wc-modal" role="dialog" aria-modal="true" aria-labelledby="wcTitle">
    <div class="wc-modal-head">
      <h2 id="wcTitle">巡回対象の企業リスト</h2>
      <button id="wcClose" type="button" aria-label="閉じる">✕</button>
    </div>
    <p class="wc-modal-sub" id="wcUpdated"></p>
    <div id="wcBody" class="wc-modal-body"></div>
  </div>
</div>

<script src="exceljs.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let DATA = null;
const TIER_ORDER = ["コア", "ベンチマーク", "周辺", "業界動向"];
const STATUS_ORDER = ["公式発表あり", "報道段階（本文確認済）", "報道段階（見出しのみ）"];
const REC_ORDER = ["報告", "記録のみ", "参考", "除外推奨"];
const NOVELTY_RANK = { "◎": 3, "○": 2, "△": 1 };
const IMPACT_RANK = { "大": 3, "中": 2, "小": 1 };
const state = { q: "", tier: "all", rec: "all", status: "all", company: "all", sort: "date_desc" };

async function decrypt(pw) {
  const res = await fetch("data.enc.json", { cache: "no-store" });
  if (!res.ok) throw new Error("fetch");
  const enc = await res.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

$("#gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value;
  if (!pw) { $("#err").textContent = "パスワードを入力してください。"; return; }
  $("#err").textContent = "確認しています…";
  try {
    DATA = await decrypt(pw);
    $("#pw").value = "";
    $("#gate").style.display = "none";
    $("#app").style.display = "block";
    init();
  } catch (err) {
    $("#err").textContent = err.message === "fetch"
      ? "データを読み込めませんでした。ページを再読み込みしてください。"
      : "パスワードが違います。";
  }
});
$("#pw").addEventListener("input", () => { $("#err").textContent = ""; });

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function highlight(text, q) {
  const s = esc(text);
  if (!q) return s;
  return s.replace(new RegExp(`(${escRe(esc(q))})`, "ig"), "<mark>$1</mark>");
}

function uniqueSorted(items, key, order) {
  const present = new Set(items.map((i) => i[key]).filter(Boolean));
  const ordered = order.filter((v) => present.has(v));
  const rest = [...present].filter((v) => !order.includes(v)).sort((a, b) => a.localeCompare(b, "ja"));
  return [...ordered, ...rest];
}

function init() {
  const items = DATA.items;

  // 区分チップ（すべて＋実際に存在する区分のみ）
  const tiers = uniqueSorted(items, "tier", TIER_ORDER);
  const tierWrap = $("#tierFilters");
  tierWrap.innerHTML = [`<button data-tier="all" aria-pressed="true">すべて</button>`]
    .concat(tiers.map((t) => `<button data-tier="${esc(t)}" aria-pressed="false"><span class="dot" style="background:var(--${tierVar(t)})"></span>${esc(t)}</button>`))
    .join("");
  tierWrap.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    tierWrap.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    state.tier = b.dataset.tier;
    render();
  }));

  fillSelect("#fRec", uniqueSorted(items, "recommendation", REC_ORDER), "AI推奨：すべて");
  fillSelect("#fStatus", uniqueSorted(items, "status", STATUS_ORDER), "確認状況：すべて");
  fillSelect("#fCompany", uniqueSorted(items, "company", []), "企業：すべて");

  $("#fRec").addEventListener("change", (e) => { state.rec = e.target.value; render(); });
  $("#fStatus").addEventListener("change", (e) => { state.status = e.target.value; render(); });
  $("#fCompany").addEventListener("change", (e) => { state.company = e.target.value; render(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });

  render();
}

function tierVar(t) {
  return t === "コア" ? "core" : t === "ベンチマーク" ? "bench" : t === "業界動向" ? "trend" : "periph";
}

function fillSelect(sel, values, allLabel) {
  const el = $(sel);
  el.innerHTML = [`<option value="all">${allLabel}</option>`]
    .concat(values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`)).join("");
}

function sortItems(items) {
  const arr = [...items];
  if (state.sort === "date_asc") arr.sort((a, b) => new Date(a.date) - new Date(b.date));
  else if (state.sort === "impact") arr.sort((a, b) => (IMPACT_RANK[b.impact] || 0) - (IMPACT_RANK[a.impact] || 0));
  else if (state.sort === "novelty") arr.sort((a, b) => (NOVELTY_RANK[b.novelty] || 0) - (NOVELTY_RANK[a.novelty] || 0));
  else arr.sort((a, b) => new Date(b.date) - new Date(a.date));
  return arr;
}

function matches(i) {
  if (state.tier !== "all" && i.tier !== state.tier) return false;
  if (state.rec !== "all" && i.recommendation !== state.rec) return false;
  if (state.status !== "all" && i.status !== state.status) return false;
  if (state.company !== "all" && i.company !== state.company) return false;
  if (state.q) {
    const hay = `${i.company} ${i.title} ${i.reason} ${i.viewpoint}`.toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function render() {
  const g = new Date(DATA.generated_at);
  const wd = "日月火水木金土"[g.getDay()];
  $("#dateTitle").innerHTML = `${g.getMonth() + 1}月${g.getDate()}日（${wd}）の候補<small>${esc(DATA.period)}</small>`;
  const items = DATA.items;
  const n = (f) => items.filter(f).length;
  $("#tally").innerHTML = `全<b>${items.length}</b>件　AI推奨「報告」<b>${n((i) => i.recommendation === "報告")}</b>件　報道段階<b>${n((i) => i.status.startsWith("報道段階"))}</b>件`;

  const shown = sortItems(items.filter(matches));
  const filtered = shown.length !== items.length;
  $("#resultCount").innerHTML = filtered
    ? `絞り込み中：<b>${shown.length}</b>件（全${items.length}件中）<button id="resetBtn" type="button">条件をリセット</button>`
    : `全${items.length}件を表示中`;
  const resetBtn = $("#resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", resetFilters);

  $("#list").innerHTML = shown.length ? shown.map(row).join("") : `
    <li class="empty">この条件に一致する候補はありません。<br>
    <button type="button" id="resetBtn2">条件をリセット</button></li>`;
  const resetBtn2 = $("#resetBtn2");
  if (resetBtn2) resetBtn2.addEventListener("click", resetFilters);
}

function resetFilters() {
  state.q = ""; state.tier = "all"; state.rec = "all"; state.status = "all"; state.company = "all";
  $("#q").value = "";
  $("#fRec").value = "all"; $("#fStatus").value = "all"; $("#fCompany").value = "all";
  $("#tierFilters").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tier === "all")));
  render();
}

function row(i) {
  const statusCls = i.status.startsWith("報道段階") ? "warn" : "";
  const recCls = i.recommendation === "報告" ? "go" : "";
  const q = state.q;
  const titleHtml = highlight(i.title, q);
  const title = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${titleHtml}</a>` : titleHtml;
  const d = i.draft;
  const draft = d ? `<details><summary>5観点分析を見る</summary><dl class="draft">
    <dt>① 要約</dt><dd>${esc(d.summary)}</dd><dt>② 斬新性</dt><dd>${esc(d.novelty)}</dd>
    <dt>③ 学び</dt><dd>${esc(d.learning)}</dd><dt>④ 自社への導入可能性</dt><dd>${esc(d.feasibility)}</dd>
    <dt>⑤ 取るべきアクション（案）</dt><dd>${esc(d.action)}</dd></dl></details>` : "";
  return `<li data-tier="${esc(i.tier)}">
    <p class="meta"><span>${highlight(i.company, q)}</span><span>${esc(i.source)}</span><span>${fmtDate(i.date)}</span></p>
    <p class="title">${title}</p>
    <div class="tags"><span class="tag tier-${esc(i.tier)}">${esc(i.tier)}</span><span class="tag ${recCls}">AI推奨：${esc(i.recommendation)}</span><span class="tag ${statusCls}">${esc(i.status)}</span><span class="tag">${esc(i.viewpoint)}</span></div>
    <p class="reason">${highlight(i.reason, q)}</p>${draft}</li>`;
}

const JUDGE = ["報告", "保留", "除外"];
const REASONS = ["対象外の企業", "富裕層と無関係", "既報・重複", "影響が小さい", "情報不足", "その他"];

async function buildExcel() {
  if (typeof ExcelJS === "undefined") throw new Error("lib");
  const wb = new ExcelJS.Workbook();
  const head = { font: { bold: true, color: { argb: "FFFFFFFF" } }, fill: { type: "pattern", pattern: "solid", fgColor: { argb: "FF16202A" } } };
  const styleHead = (ws) => { ws.getRow(1).eachCell((c) => { c.font = head.font; c.fill = head.fill; c.alignment = { vertical: "middle" }; }); ws.views = [{ state: "frozen", ySplit: 1 }]; };

  const ws = wb.addWorksheet("候補一覧");
  ws.columns = [
    { header: "ID", key: "id", width: 13 }, { header: "日付", key: "date", width: 11 },
    { header: "区分", key: "tier", width: 11 }, { header: "社名", key: "company", width: 20 },
    { header: "見出し", key: "title", width: 48 }, { header: "媒体", key: "source", width: 18 },
    { header: "確認状況", key: "status", width: 20 }, { header: "観点", key: "viewpoint", width: 18 },
    { header: "AI推奨", key: "recommendation", width: 10 }, { header: "推奨理由", key: "reason", width: 36 },
    { header: "斬新性", key: "novelty", width: 8 }, { header: "自社影響", key: "impact", width: 9 },
    { header: "判断", key: "judge", width: 9 }, { header: "除外理由", key: "why", width: 16 },
    { header: "メモ", key: "memo", width: 30 }, { header: "URL", key: "url", width: 40 },
  ];
  DATA.items.forEach((i) => {
    const r = ws.addRow({ ...i, judge: "", why: "", memo: "", url: i.url || "" });
    if (i.url) r.getCell("url").value = { text: i.url, hyperlink: i.url };
    r.alignment = { vertical: "top", wrapText: true };
  });
  styleHead(ws);
  ws.autoFilter = { from: "A1", to: "P1" };
  const last = Math.max(DATA.items.length + 1, 200);
  for (let r = 2; r <= last; r++) {
    ws.getCell(`M${r}`).dataValidation = { type: "list", allowBlank: true, formulae: [`"${JUDGE.join(",")}"`] };
    ws.getCell(`N${r}`).dataValidation = { type: "list", allowBlank: true, formulae: [`"${REASONS.join(",")}"`] };
  }
  ["M", "N"].forEach((c) => { ws.getColumn(c).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFBF0DC" } }; });
  ws.getRow(1).eachCell((c) => { c.fill = head.fill; });

  const wd = wb.addWorksheet("速報下書き");
  wd.columns = [
    { header: "ID", key: "id", width: 13 }, { header: "社名", key: "company", width: 18 }, { header: "見出し", key: "title", width: 36 },
    { header: "① 要約", key: "summary", width: 48 }, { header: "② 斬新性", key: "novelty", width: 36 },
    { header: "③ 学び", key: "learning", width: 48 }, { header: "④ 自社への導入可能性", key: "feasibility", width: 40 },
    { header: "⑤ 取るべきアクション（案）", key: "action", width: 48 },
  ];
  DATA.items.filter((i) => i.draft).forEach((i) => {
    wd.addRow({ id: i.id, company: i.company, title: i.title, ...i.draft }).alignment = { vertical: "top", wrapText: true };
  });
  styleHead(wd);

  const wm = wb.addWorksheet("見逃し記録");
  wm.columns = [
    { header: "記録日", key: "a", width: 11 }, { header: "社名", key: "b", width: 18 }, { header: "見出し", key: "c", width: 48 },
    { header: "URL", key: "d", width: 40 }, { header: "どこで気づいたか", key: "e", width: 24 }, { header: "メモ", key: "f", width: 30 },
  ];
  styleHead(wm);

  const buf = await wb.xlsx.writeBuffer();
  const g = new Date(DATA.generated_at);
  const name = `競合ウォッチ_${g.getFullYear()}${String(g.getMonth() + 1).padStart(2, "0")}${String(g.getDate()).padStart(2, "0")}.xlsx`;
  const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$("#dl").addEventListener("click", async () => {
  const btn = $("#dl"), label = btn.textContent;
  btn.textContent = "作成しています…";
  try { await buildExcel(); btn.textContent = "ダウンロードしました"; }
  catch (e) { btn.textContent = e.message === "lib" ? "Excel部品を読み込めませんでした" : "作成できませんでした"; }
  setTimeout(() => { btn.textContent = label; }, 2500);
});

// ---------- 企業リストのポップアップ（watch_config.json、暗号化なし・低機密） ----------
let WC_DATA = null;
async function loadWatchConfig() {
  if (WC_DATA) return WC_DATA;
  const res = await fetch("watch_config.json", { cache: "no-store" });
  if (!res.ok) throw new Error("fetch");
  WC_DATA = await res.json();
  return WC_DATA;
}
function renderWatchConfig(data) {
  const g = new Date(data.generated_at);
  $("#wcUpdated").textContent = `最終更新：${g.getFullYear()}/${g.getMonth() + 1}/${g.getDate()}（WATCH_CONFIG.xlsxで管理）`;
  $("#wcBody").innerHTML = data.sections.map((sec) => `
    <div class="wc-tier wc-${esc(sec.tier)}">${esc(sec.tier)}</div>
    ${sec.companies.map((c) => `
      <div class="wc-company">
        <span class="wc-company-name">${esc(c.name)}</span><span class="wc-company-cat">${esc(c.category)}</span>
        ${c.media.map((m) => `
          <p class="wc-media"><span class="wc-media-label">${esc(m.label)}：</span>${
            m.url && m.url.startsWith("http")
              ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.url)}</a>`
              : esc(m.url)
          }</p>`).join("")}
      </div>`).join("")}
  `).join("");
}
async function openWatchConfig() {
  $("#wcOverlay").hidden = false;
  $("#wcBody").innerHTML = `<p style="color:var(--sub);font-size:13px;">読み込んでいます…</p>`;
  try {
    renderWatchConfig(await loadWatchConfig());
  } catch (e) {
    $("#wcBody").innerHTML = `<p style="color:#A32D2D;font-size:13px;">読み込めませんでした。ページを再読み込みしてください。</p>`;
  }
}
$("#showWatchConfig").addEventListener("click", openWatchConfig);
$("#wcClose").addEventListener("click", () => { $("#wcOverlay").hidden = true; });
$("#wcOverlay").addEventListener("click", (e) => { if (e.target.id === "wcOverlay") $("#wcOverlay").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#wcOverlay").hidden = true; });
</script>
